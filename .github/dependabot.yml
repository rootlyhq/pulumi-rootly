version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/provider"
      - "/provider/shim"
      - "/sdk"
      - "/examples"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      pulumi:
        patterns:
          - "github.com/pulumi/*"
      rootly-terraform-provider:
        patterns:
          - "github.com/rootlyhq/terraform-provider-rootly/*"

  - package-ecosystem: "npm"
    directory: "/sdk/nodejs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      pulumi:
        patterns:
          - "@pulumi/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
